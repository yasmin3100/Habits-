<style>

:root[data-phase="pm"]{--bg:#0a0e1f;--fg:#e9edff;--dim:#8f99c4;--acc:#a3b6ff;--on:#0a0e1f;--line:#ffffff1c;--card:#ffffff0d;--glyph:#e3e9ff;--glow:#5a6bd8;--m1:#ffc372;--m2:#ff93b4;--m3:#a9bcff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--fg);font:16px/1.45 var(--fb);background:radial-gradient(120% 440px at 50% 0,color-mix(in srgb,var(--glow) 40%,transparent),transparent 72%) no-repeat,var(--bg);background-attachment:scroll;min-height:100%;transition:background-color .4s,color .4s}

button{font:inherit;color:inherit}

.chips{display:flex;gap:6px;overflow-x:auto;margin:6px 0 10px;padding-bottom:4px}

.row{display:grid;grid-template-columns:26px 24px 1fr auto;align-items:center;gap:12px;flex:1 1 70%;min-width:0;background:none;border:0;padding:13px 0;text-align:left;cursor:pointer}

.nm2{min-width:0;font-weight:500}.nm2 small{display:block;color:var(--dim);font-size:12px;font-weight:400}
.ico{display:flex;justify-content:center;align-items:center;width:24px}

.day{margin-top:26px}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;position:relative}

.sum{display:flex;justify-content:space-between;margin-top:6px;font-size:13px}
details{margin-top:24px;border-top:1px solid var(--line);padding-top:12px}

.panel{margin-top:14px;background:var(--card);border-radius:14px;padding:14px}

.panel input[type=text]{flex:1}
.icons{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}

.act{background:var(--acc);color:var(--on);border:0;border-radius:10px;font-weight:700;padding:9px 16px;cursor:pointer}
.ghost{background:none;border:1px solid var(--line);color:var(--dim);border-radius:10px;padding:9px 14px;cursor:pointer}
.tools{margin-top:14px;display:flex;gap:14px;font-size:13px;flex-wrap:wrap;align-items:center}

.bk{display:flex;align-items:center;gap:6px}.bk>span{display:flex;gap:6px}
.bk button{background:none;border:1px solid var(--line);color:var(--dim);border-radius:10px;padding:2px 9px;font-size:11px;cursor:pointer}
.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:6px;padding:8px 14px calc(8px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line)}

button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.kcard{background:var(--card);border-radius:18px;padding:18px;margin-top:6px}
.ktag{font-size:12px;color:var(--dim)}
.ktitle{font:800 28px/1.3 var(--fd);margin:8px 0 6px}
.khint{color:var(--dim);margin-bottom:14px}
.klinks{display:flex;gap:8px;margin-bottom:14px}
.lk{border:1px solid var(--line);border-radius:12px;padding:6px 14px;color:var(--acc);text-decoration:none;font-size:14px}

.kact{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

.kp{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:14px}
.kp .nm{flex:1;min-width:0}.kp .mb{width:90px;height:8px;background:var(--line);border-radius:4px;overflow:hidden}.kp .mb b{display:block;height:100%;background:var(--acc)}.kp .n{min-width:48px;text-align:right;color:var(--dim);font-size:13px}

.kg{font-size:12px;color:var(--dim);margin:14px 0 2px}

 background:linear-gradient(90deg,rgba(0,0,0,.4) 0 9px,rgba(255,255,255,.07) 9px 11px,transparent 11px),linear-gradient(160deg,color-mix(in srgb,var(--c) 88%,#fff 10%),color-mix(in srgb,var(--c) 72%,#000));
 box-shadow:inset 0 0 0 7px transparent,inset 0 0 0 8px rgba(220,191,117,.55),0 12px 16px rgba(0,0,0,.55)}
